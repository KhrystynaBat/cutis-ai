<a class="skip-link" href="#main">Перейти до вмісту</a>
<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    aria-label="Головне меню"
  >
    <div class="sidenav-inner">
      <div class="brand">
        <img class="brand-logo" src="favicon.svg" alt="" width="32" height="32" />
        <span>CutisAI</span>
      </div>
      @if (auth.user(); as u) {
        <p class="role-chip">{{ roleLabels[u.role] }}</p>
      }
      <nav aria-label="Розділи">
        <mat-nav-list>
          @for (item of navItems(); track item.link) {
            <a
              mat-list-item
              [routerLink]="item.link"
              routerLinkActive
              #rla="routerLinkActive"
              [activated]="rla.isActive"
              [attr.aria-current]="rla.isActive ? 'page' : null"
              (click)="isMobile() && drawer.close()"
            >
              <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </mat-nav-list>
      </nav>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isMobile()) {
        <button mat-icon-button type="button" (click)="drawer.toggle()" aria-label="Відкрити меню">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <h1 class="section-title">{{ sectionTitle() }}</h1>
      <span class="spacer"></span>
      @if (auth.user()?.role === 'Doctor') {
        <app-notification-bell />
      }
      @if (auth.user(); as u) {
        <button
          mat-button
          type="button"
          class="user-btn"
          [matMenuTriggerFor]="userMenu"
          aria-label="Меню профілю"
        >
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ u | shortName }}</span>
        </button>
        <mat-menu #userMenu="matMenu" xPosition="before">
          <a mat-menu-item routerLink="/profile">
            <mat-icon>person</mat-icon>
            <span>Мій профіль</span>
          </a>
          <button mat-menu-item type="button" (click)="changePassword()">
            <mat-icon>key</mat-icon>
            <span>Змінити пароль</span>
          </button>
          <mat-divider />
          <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Вийти</span>
          </button>
        </mat-menu>
      }
    </mat-toolbar>
    <main id="main" class="content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
